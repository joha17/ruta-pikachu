# Construye la app y la publica en GitHub Pages en cada push a main (o a mano desde «Actions»).
# Antes de que funcione: en el repo, Settings → Pages → Source: «GitHub Actions».
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # La app vive en https://USUARIO.github.io/NOMBRE-DEL-REPO/ (o en la raíz si el repo es USUARIO.github.io).
      - name: Ruta base
        run: |
          repo="${{ github.event.repository.name }}"
          if [[ "$repo" == *.github.io ]]; then echo "BASE=/" >> "$GITHUB_ENV"; else echo "BASE=/$repo/" >> "$GITHUB_ENV"; fi
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
